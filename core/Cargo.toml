[package]
name = "amyfree-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Amyfree runtime core: subscriptions, nodes, chain proxy, speed tests and rule data"

[lib]
name = "amyfree_core"
path = "src/lib.rs"

[[bin]]
name = "amyfree-helper"
path = "src/bin/amyfree-helper.rs"

[dependencies]
base64 = "0.23.1"
percent-encoding = "2.3.2"
rand = "0.10.3"
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
time = "0.3.55"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.8"
x509-parser = "0.18.1"
yaml-rust2 = "0.13.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
signal-hook = "0.4.5"
